name: Build Admin Docker Images

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push Admin Docker images to GHCR after smoke passes"
        required: true
        default: false
        type: boolean
      current_image_tag:
        description: "Current deployed Admin Docker image tag for rollback/runbook evidence"
        required: false
        type: string
      rollback_image_tag:
        description: "Rollback Admin Docker image tag, normally matching the current deployed tag"
        required: false
        type: string
      export_image_archives:
        description: "Export docker-loadable Admin image archives as workflow artifacts after push"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-admin.yml"
      - "apps/admin-web/**"
      - "apps/admin-api/**"
      - "packages/**"
      - "scripts/**"
      - "deploy/nas/mixlab/**"
      - "docs/acceptance/evidence/**"
      - "docs/deployment/m19-nas-docker.md"
      - "docs/spec-traceability.md"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIXLAB_ACCEPTANCE_OUTPUT_DIR: .local-dev/admin-docker-release-gates
      MIXLAB_ACCEPTANCE_ARTIFACT_DIR: .local-dev/admin-docker-release-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run searchd tests
        run: npm run test:searchd

      - name: Verify evidence tooling
        run: npm run test:acceptance-evidence

      - name: Audit delivery readiness
        run: npm run audit:delivery-readiness

      - name: Package evidence kit
        run: npm run package:evidence-kit

      - name: Validate evidence kit manifest
        run: npm run validate:evidence-kit-manifest

      - name: Validate evidence kit draft metadata
        run: npm run validate:evidence-kit-drafts

      - name: Run packaged manifest self-check
        run: sh dist/acceptance/mixlab-evidence-kit/evidence-kit-manifest-self-check.sh dist/acceptance/mixlab-evidence-kit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run local Docker MVP smoke
        env:
          MIXLAB_ADMIN_DOCKER_LOCAL_SMOKE_RUN: "1"
          MIXLAB_ADMIN_DOCKER_LOCAL_SMOKE_REQUIRE_PASS: "1"
          MIXLAB_ADMIN_DOCKER_LOCAL_SMOKE_WEB_PORT: "18081"
          MIXLAB_BUILD_SHA: ${{ github.sha }}
          MIXLAB_BUILD_VERSION: ${{ github.sha }}
          MIXLAB_IMAGE_TAG: ${{ github.sha }}
        run: npm run validate:admin-docker-local-smoke

      - name: Upload local Docker MVP smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixlab-admin-docker-local-smoke
          path: |
            .local-dev/admin-docker-release-gates/admin-docker-local-smoke-*.json
            .local-dev/admin-docker-release-gates/admin-docker-local-smoke-*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Generate pre-staging Admin Docker release evidence
        env:
          MIXLAB_ADMIN_DOCKER_CANDIDATE_FROM_LOCAL_SMOKE: "1"
          MIXLAB_ADMIN_DOCKER_CANDIDATE_BASE_URL: ""
          MIXLAB_ADMIN_DOCKER_CANDIDATE_API_BASE_URL: ""
          MIXLAB_ADMIN_DOCKER_LIVE_BASE_URL: ""
          MIXLAB_ADMIN_DOCKER_LIVE_EXPECT_LIBRARY_ROOT: "/data/PublicLibrary"
          MIXLAB_CUTTER_EXPECTED_READY_COUNT: "10471"
          MIXLAB_CUTTER_EXPECTED_RELEASE_VERSION: "v010471"
        run: |
          npm run validate:admin-docker-candidate-contract-proof
          npm run validate:admin-docker-release-live-readonly
          npm run validate:admin-docker-version-parity-plan
          npm run validate:admin-worker-env-proof
          npm run validate:admin-cutter-compatibility-proof

      - name: Log in to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build admin runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin-runtime.Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true }}
          tags: |
            ghcr.io/alin155/mixlab-admin-runtime:${{ github.sha }}
          build-args: |
            MIXLAB_BUILD_SHA=${{ github.sha }}
            MIXLAB_BUILD_VERSION=${{ github.sha }}
            MIXLAB_IMAGE_TAG=${{ github.sha }}
            MIXLAB_ADMIN_DOCKER_MVP_MODE=v0.1

      - name: Build admin web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin-web.Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true }}
          tags: |
            ghcr.io/alin155/mixlab-admin-web:${{ github.sha }}
          build-args: |
            MIXLAB_BUILD_SHA=${{ github.sha }}
            MIXLAB_BUILD_VERSION=${{ github.sha }}
            MIXLAB_IMAGE_TAG=${{ github.sha }}
            MIXLAB_ADMIN_DOCKER_MVP_MODE=v0.1

      - name: Export Admin Docker image archives
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true && inputs.export_image_archives == true }}
        env:
          MIXLAB_DOCKER_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive_dir="dist/admin-docker-images"
          mkdir -p "$archive_dir"

          runtime_image="ghcr.io/alin155/mixlab-admin-runtime:${MIXLAB_DOCKER_IMAGE_TAG}"
          web_image="ghcr.io/alin155/mixlab-admin-web:${MIXLAB_DOCKER_IMAGE_TAG}"

          docker pull "$runtime_image"
          docker pull "$web_image"

          docker save "$runtime_image" | gzip -1 > "$archive_dir/mixlab-admin-runtime-${MIXLAB_DOCKER_IMAGE_TAG}.tar.gz"
          docker save "$web_image" | gzip -1 > "$archive_dir/mixlab-admin-web-${MIXLAB_DOCKER_IMAGE_TAG}.tar.gz"

          (
            cd "$archive_dir"
            sha256sum *.tar.gz > SHA256SUMS
          )

          node <<'NODE'
          const { readdirSync, readFileSync, statSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const archiveDir = "dist/admin-docker-images";
          const imageTag = process.env.MIXLAB_DOCKER_IMAGE_TAG;
          const checksums = new Map(
            readFileSync(join(archiveDir, "SHA256SUMS"), "utf8")
              .trim()
              .split(/\n/)
              .filter(Boolean)
              .map((line) => {
                const [sha256, file] = line.trim().split(/\s+/, 2);
                return [file, sha256];
              })
          );
          const archives = readdirSync(archiveDir)
            .filter((file) => file.endsWith(".tar.gz"))
            .sort()
            .map((file) => ({
              file,
              image_tag: imageTag,
              image:
                file.includes("runtime")
                  ? `ghcr.io/alin155/mixlab-admin-runtime:${imageTag}`
                  : `ghcr.io/alin155/mixlab-admin-web:${imageTag}`,
              sha256: checksums.get(file),
              size_bytes: statSync(join(archiveDir, file)).size
            }));
          writeFileSync(
            join(archiveDir, "manifest.json"),
            JSON.stringify(
              {
                schema_version: 1,
                generated_by: "Build Admin Docker Images",
                github_sha: imageTag,
                artifact_name: `mixlab-admin-docker-image-archives-${imageTag}`,
                format: "docker save gzip",
                load_command: "docker load -i <archive>.tar.gz",
                archives
              },
              null,
              2
            ) + "\n"
          );
          NODE

          ls -lh "$archive_dir"

      - name: Upload Admin Docker image archives
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true && inputs.export_image_archives == true }}
        uses: actions/upload-artifact@v4
        with:
          name: mixlab-admin-docker-image-archives-${{ github.sha }}
          path: |
            dist/admin-docker-images/*.tar.gz
            dist/admin-docker-images/SHA256SUMS
            dist/admin-docker-images/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate Admin Docker staging and release readiness reports
        env:
          MIXLAB_DOCKER_CURRENT_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.current_image_tag || '' }}
          MIXLAB_DOCKER_TARGET_IMAGE_TAG: ${{ github.sha }}
          MIXLAB_DOCKER_ROLLBACK_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_image_tag || '' }}
          MIXLAB_DOCKER_PUSH_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images == true && 'workflow_dispatch:push_images=true' || '' }}
        run: |
          npm run intake:admin-docker-nas-release-inputs
          npm run validate:admin-docker-staging-runbook
          npm run validate:admin-docker-release-readiness-summary
          npm run validate:admin-docker-github-artifact-readiness

      - name: Upload Admin Docker release gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixlab-admin-docker-release-gates
          path: |
            .local-dev/admin-docker-release-gates/admin-docker-local-smoke-*.json
            .local-dev/admin-docker-release-gates/admin-docker-local-smoke-*.md
            .local-dev/admin-docker-release-gates/admin-docker-candidate-contract-proof-*.json
            .local-dev/admin-docker-release-gates/admin-docker-candidate-contract-proof-*.md
            .local-dev/admin-docker-release-gates/admin-docker-release-live-readonly-*.json
            .local-dev/admin-docker-release-gates/admin-docker-release-live-readonly-*.md
            .local-dev/admin-docker-release-gates/admin-docker-version-parity-plan-*.json
            .local-dev/admin-docker-release-gates/admin-docker-version-parity-plan-*.md
            .local-dev/admin-docker-release-gates/admin-worker-env-proof-*.json
            .local-dev/admin-docker-release-gates/admin-worker-env-proof-*.md
            .local-dev/admin-docker-release-gates/admin-cutter-compatibility-proof-*.json
            .local-dev/admin-docker-release-gates/admin-cutter-compatibility-proof-*.md
            .local-dev/admin-docker-release-gates/admin-docker-nas-release-inputs-intake-*.json
            .local-dev/admin-docker-release-gates/admin-docker-nas-release-inputs-intake-*.md
            .local-dev/admin-docker-release-gates/admin-docker-staging-runbook-*.json
            .local-dev/admin-docker-release-gates/admin-docker-staging-runbook-*.md
            .local-dev/admin-docker-release-gates/admin-docker-release-readiness-summary-*.json
            .local-dev/admin-docker-release-gates/admin-docker-release-readiness-summary-*.md
            .local-dev/admin-docker-release-gates/admin-docker-github-artifact-readiness-*.json
            .local-dev/admin-docker-release-gates/admin-docker-github-artifact-readiness-*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload target evidence kit
        uses: actions/upload-artifact@v4
        with:
          name: mixlab-target-evidence-kit
          path: dist/acceptance/mixlab-evidence-kit
          if-no-files-found: error
          retention-days: 30
