services:
  admin-api:
    image: ghcr.io/alin155/mixlab-admin-runtime:${MIXLAB_IMAGE_TAG:?Set MIXLAB_IMAGE_TAG to an immutable candidate SHA}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MIXLAB_ADMIN_API_HOST: 0.0.0.0
      MIXLAB_ADMIN_API_PORT: 3889
      MIXLAB_ADMIN_LIBRARY_ROOT: /data/PublicLibrary
      MIXLAB_ADMIN_DOCKER_MVP_MODE: ${MIXLAB_ADMIN_DOCKER_MVP_MODE:-v0.1}
      MIXLAB_IMAGE_TAG: ${MIXLAB_IMAGE_TAG:?Set MIXLAB_IMAGE_TAG to an immutable candidate SHA}
      MIXLAB_PREPROCESS_DISK_BLOCK_USAGE_PERCENT: ${MIXLAB_PREPROCESS_DISK_BLOCK_USAGE_PERCENT:-92}
      MIXLAB_FFMPEG_PATH: /usr/bin/ffmpeg
      MIXLAB_FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - ${PUBLIC_LIBRARY_HOST_PATH}:/data/PublicLibrary
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3889/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-worker:
    image: ghcr.io/alin155/mixlab-admin-runtime:${MIXLAB_IMAGE_TAG:?Set MIXLAB_IMAGE_TAG to an immutable candidate SHA}
    restart: unless-stopped
    depends_on:
      - admin-api
    env_file:
      - .env
    environment:
      MIXLAB_ADMIN_LIBRARY_ROOT: /data/PublicLibrary
      MIXLAB_PREPROCESS_LIBRARY_ROOT: /data/PublicLibrary
      MIXLAB_ADMIN_DOCKER_MVP_MODE: ${MIXLAB_ADMIN_DOCKER_MVP_MODE:-v0.1}
      MIXLAB_IMAGE_TAG: ${MIXLAB_IMAGE_TAG:?Set MIXLAB_IMAGE_TAG to an immutable candidate SHA}
      MIXLAB_FFMPEG_PATH: /usr/bin/ffmpeg
      MIXLAB_FFPROBE_PATH: /usr/bin/ffprobe
      MIXLAB_WORKER_POLL_INTERVAL_SECONDS: ${MIXLAB_WORKER_POLL_INTERVAL_SECONDS:-60}
      MIXLAB_ENABLE_LIBRARY_PREPROCESS_WORKER: ${MIXLAB_ENABLE_LIBRARY_PREPROCESS_WORKER:-0}
      MIXLAB_ENABLE_READY_PUBLISH_WORKER: ${MIXLAB_ENABLE_READY_PUBLISH_WORKER:-0}
      MIXLAB_PREPROCESS_COUNT_REFRESH_INTERVAL: ${MIXLAB_PREPROCESS_COUNT_REFRESH_INTERVAL:-25}
      MIXLAB_PREPROCESS_DISK_BLOCK_USAGE_PERCENT: ${MIXLAB_PREPROCESS_DISK_BLOCK_USAGE_PERCENT:-92}
    volumes:
      - ${PUBLIC_LIBRARY_HOST_PATH}:/data/PublicLibrary
    command: ["npm", "run", "worker:admin-loop"]

  admin-web:
    image: ghcr.io/alin155/mixlab-admin-web:${MIXLAB_IMAGE_TAG:?Set MIXLAB_IMAGE_TAG to an immutable candidate SHA}
    restart: unless-stopped
    depends_on:
      - admin-api
    ports:
      - "${MIXLAB_ADMIN_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
