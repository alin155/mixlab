<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef2f8; font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; color: #162033; }
  .window { width: 760px; height: 560px; background: #f6f8fc; overflow: hidden; }
  .titlebar { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: #ffffff; border-bottom: 1px solid #e6ebf3; }
  .titlebar .brand { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #5f6f86; font-weight: 600; }
  .brand-mark { width: 18px; height: 18px; border-radius: 5px; background: #2f6fed; color: #fff; font-size: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: -.2px; }
  .win-controls { display: flex; gap: 16px; color: #8b98aa; font-size: 14px; }
  .content { padding: 26px 32px 22px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; }
  .heading { font-size: 24px; line-height: 1.25; font-weight: 800; letter-spacing: -.4px; color: #101a2e; }
  .subheading { margin-top: 7px; font-size: 13px; color: #718096; }
  .version { margin-top: 2px; padding: 5px 9px; border-radius: 999px; background: #eaf1ff; color: #2f6fed; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .status-card { margin-top: 22px; background: #fff; border: 1px solid #e4eaf3; border-radius: 16px; padding: 20px 22px; box-shadow: 0 8px 24px rgba(29, 53, 87, .06); }
  .status-top { display: flex; gap: 14px; align-items: center; }
  .status-icon { width: 42px; height: 42px; border-radius: 12px; background: #e9f7ef; color: #19a463; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; }
  .status-copy { flex: 1; }
  .status-title { font-size: 16px; font-weight: 800; color: #14213a; }
  .status-desc { margin-top: 4px; font-size: 12px; color: #7b8799; line-height: 1.5; }
  .steps { margin-top: 18px; display: flex; gap: 8px; }
  .step { flex: 1; padding: 9px 10px; border-radius: 9px; background: #f4f7fb; color: #99a5b5; font-size: 11px; font-weight: 700; display: flex; gap: 7px; align-items: center; }
  .step .num { width: 17px; height: 17px; border-radius: 50%; background: #e2e8f1; color: #8a97a8; display: flex; align-items: center; justify-content: center; font-size: 9px; }
  .step.active { background: #eef4ff; color: #2f6fed; }
  .step.active .num { background: #2f6fed; color: #fff; }
  .actions { margin-top: 20px; display: flex; gap: 14px; align-items: center; }
  .primary { height: 46px; padding: 0 26px; border-radius: 10px; background: #2f6fed; color: #fff; border: 0; font-size: 14px; font-weight: 800; letter-spacing: .1px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(47,111,237,.22); }
  .secondary { height: 38px; padding: 0 12px; border-radius: 8px; background: transparent; border: 0; color: #74839a; font-size: 12px; font-weight: 600; }
  .safe-note { margin-top: 17px; display: flex; gap: 8px; align-items: flex-start; font-size: 11px; color: #8592a6; line-height: 1.6; }
  .safe-note b { color: #52627a; font-weight: 700; }
  .icon { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #aab7c8; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #8291a6; flex: none; margin-top: 1px; }
  .footer { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #a0adbe; }
  .footer strong { color: #718096; font-weight: 700; }
  .advanced { display: none; margin-top: 12px; background: #fff; border: 1px solid #e4eaf3; border-radius: 12px; padding: 10px 14px; }
  .advanced-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 12px; color: #5b6c83; border-bottom: 1px solid #f0f3f8; }
  .advanced-row:last-child { border-bottom: 0; }
  .advanced-row span:last-child { color: #2f6fed; font-weight: 700; font-size: 11px; }
  .chevron { margin-left: 4px; color: #9ca9ba; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="brand"><div class="brand-mark">ML</div><span>MixLab Cutter 修复工具</span></div>
      <div class="win-controls">—　□　×</div>
    </div>
    <div class="content">
      <div class="header">
        <div>
          <div class="heading">修复工具</div>
          <div class="subheading">工作台加载异常时，帮助你安全恢复本机引擎。</div>
        </div>
        <div class="version">v1.3.0</div>
      </div>

      <div class="status-card">
        <div class="status-top">
          <div class="status-icon">✓</div>
          <div class="status-copy">
            <div class="status-title">准备就绪</div>
            <div class="status-desc">将自动检查本机引擎、工作区与系统状态，并尝试安全修复。</div>
          </div>
        </div>
        <div class="steps">
          <div class="step active"><span class="num">1</span>检查环境</div>
          <div class="step"><span class="num">2</span>安全修复</div>
          <div class="step"><span class="num">3</span>复检结果</div>
        </div>
        <div class="actions">
          <button class="primary">一键修复</button>
          <button class="secondary">更多选项 <span class="chevron">⌄</span></button>
        </div>
        <div class="safe-note"><span class="icon">i</span><span><b>失败会自动提交诊断给管理员。</b> 不会删除素材、项目或缓存，不需要手动导出文件。</span></div>
      </div>

      <div class="footer">
        <span>诊断与修复日志会保存在本机</span>
        <span><strong>MixLab</strong> · Windows 桌面端</span>
      </div>
    </div>
  </div>
</body>
</html>
